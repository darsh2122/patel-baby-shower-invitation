<path d="M77 48 Q73 54 77 57 M83 48 Q87 54 83 57" fill="none" stroke="#d9949a" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="80" cy="59" r="2" fill="#d9949a"/>
<!-- necklace -->
<path d="M56 101 Q80 124 104 101" fill="none" stroke="#e5bf61" stroke-width="4" stroke-linecap="round"/>
<g fill="#f3c5d5" stroke="#bda28c" stroke-width="1"><circle cx="61" cy="107" r="3.5"/><circle cx="68" cy="113" r="3.5"/><circle cx="76" cy="117" r="3.5"/><circle cx="84" cy="117" r="3.5"/><circle cx="92" cy="113" r="3.5"/><circle cx="99" cy="107" r="3.5"/></g>
<circle cx="80" cy="121" r="4.5" fill="#e8a8c0" stroke="#bda28c" stroke-width="1.5"/>
<!-- sweet in other hand -->
<path d="M111 92 Q119 81 127 92 L130 100 Q120 105 110 100Z" fill="#f5d87b" stroke="#8d7b70" stroke-width="2"/>
<path d="M118 90 Q115 84 120 80 Q124 85 122 91" fill="#ffedb2" stroke="#8d7b70" stroke-width="1.5"/>
</svg>