<ellipse cx="80" cy="111" rx="37" ry="28" fill="url(#skin)" stroke="#8d7b70" stroke-width="2.5"/>
<ellipse cx="59" cy="131" rx="18" ry="10" fill="#c8b3ed" stroke="#8d7b70" stroke-width="2"/>
<ellipse cx="101" cy="131" rx="18" ry="10" fill="#f6c8bf" stroke="#8d7b70" stroke-width="2"/>
<path d="M48 130 Q62 140 74 134 M86 134 Q100 140 112 130" fill="none" stroke="#f8e3a1" stroke-width="5" stroke-linecap="round"/>
