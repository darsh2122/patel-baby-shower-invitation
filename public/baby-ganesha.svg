<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="title">
<title id="title">Cute baby Ganesha illustration</title>
<defs>
 <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff4e7"/><stop offset="1" stop-color="#efcbb9"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff0a9"/><stop offset="1" stop-color="#e6b64f"/></linearGradient>
 <linearGradient id="pink" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffd8d3"/><stop offset="1" stop-color="#edaaa8"/></linearGradient>
</defs>
<circle cx="80" cy="80" r="76" fill="#d8f0e9"/>
<!-- peacock feather -->
<path d="M102 39 Q126 18 119 5 Q116 23 99 25 Q93 31 102 39Z" fill="#9dbb9d" stroke="#8a8177" stroke-width="1.8"/>
<ellipse cx="108" cy="25" rx="7" ry="10" transform="rotate(28 108 25)" fill="#b8dce0" stroke="#8a8177" stroke-width="1.5"/>
<ellipse cx="108" cy="25" rx="3.6" ry="5.4" transform="rotate(28 108 25)" fill="#557e91"/>
<!-- ears -->
<path d="M57 54 C38 34 15 42 17 67 C19 88 39 96 57 79Z" fill="url(#pink)" stroke="#8d7b70" stroke-width="2.5"/>
<path d="M103 54 C122 34 145 42 143 67 C141 88 121 96 103 79Z" fill="url(#pink)" stroke="#8d7b70" stroke-width="2.5"/>
<path d="M51 59 Q31 47 28 67 M109 59 Q129 47 132 67" fill="none" stroke="#d88e8d" stroke-width="2" stroke-linecap="round"/>
