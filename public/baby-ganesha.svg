<path d="M47 91 Q37 93 36 82 L34 69 Q34 64 38 65 Q42 65 43 75 L43 63 Q44 58 48 61 L50 74 L51 65 Q55 61 57 67 L57 82 Q56 91 47 91Z" fill="url(#skin)" stroke="#8d7b70" stroke-width="2"/>
<path d="M43 79 L49 78 M50 78 L55 77" stroke="#d4a49a" stroke-width="1.4"/>
<!-- head -->
<ellipse cx="80" cy="68" rx="34" ry="36" fill="url(#skin)" stroke="#8d7b70" stroke-width="2.5"/>
<!-- crown -->
<path d="M49 42 Q47 25 62 22 L62 15 Q62 9 68 9 Q74 9 74 15 L74 20 Q80 10 86 20 L91 25 Q103 28 105 42Z" fill="url(#gold)" stroke="#8d7b70" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M72 38 Q64 30 72 23 Q80 15 87 27 Q91 34 80 41Z" fill="#c6e7f0" stroke="#8d7b70" stroke-width="1.8"/>
<path d="M48 44 Q80 30 112 44 L107 50 Q80 39 53 50Z" fill="url(#gold)" stroke="#8d7b70" stroke-width="2"/>
<!-- eyes and cheeks -->
<ellipse cx="65" cy="66" rx="4.8" ry="5.5" fill="#655046"/>
<ellipse cx="95" cy="66" rx="4.8" ry="5.5" fill="#655046"/>
<path d="M59 57 Q65 53 70 57 M90 57 Q96 53 101 57" fill="none" stroke="#8d7b70" stroke-width="2.5" stroke-linecap="round"/>
<ellipse cx="59" cy="77" rx="8" ry="4.5" fill="#f3aaa8" opacity=".7"/><ellipse cx="101" cy="77" rx="8" ry="4.5" fill="#f3aaa8" opacity=".7"/>
<!-- trunk curling right -->
<path d="M76 71 Q73 87 78 96 Q82 103 91 97 Q96 92 89 88 Q84 86 84 92 Q81 85 85 74" fill="url(#skin)" stroke="#8d7b70" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
